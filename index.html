<style>
*{box-sizing:border-box;-webkit-tap-highlight-color:transparent}
html,body{margin:0;padding:0;background:#07070c;height:100%;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;font-family:"Arial Black",Impact,Arial,sans-serif;color:#fff}
html,body{overscroll-behavior:none;position:fixed;inset:0;width:100%;-webkit-touch-callout:none;-webkit-text-size-adjust:100%}
#app{display:flex;flex-direction:column;align-items:center;justify-content:flex-start;height:100%;padding-top:env(safe-area-inset-top);padding-bottom:env(safe-area-inset-bottom);touch-action:none}
#wrap{position:relative;line-height:0;flex:none}
canvas{display:block;image-rendering:auto;touch-action:none;border-radius:6px;box-shadow:0 0 24px rgba(255,200,0,.25)}
.hudbtn{position:absolute;top:4px;width:30px;height:30px;border-radius:50%;border:2px solid #ffd400;background:rgba(0,0,0,.6);color:#ffd400;font-size:14px;line-height:26px;text-align:center;cursor:pointer;padding:0;font-family:Arial,sans-serif;font-weight:bold;touch-action:manipulation}
#muteBtn{right:4px}#musicBtn{right:40px}#pauseBtn{right:76px}
body.touch .hudbtn{width:36px;height:36px;line-height:32px;font-size:16px}
body.touch #musicBtn{right:46px}body.touch #pauseBtn{right:88px}
/* D-pad: the whole lower area is the hit zone (quadrants around the centre); buttons are the visual targets */
#dpad{position:relative;flex:1 1 auto;width:100%;min-height:0;display:none;touch-action:none;--b:88px;--g:8px}
body.touch #dpad{display:block}
#dpadCross{position:absolute;left:50%;top:50%;width:calc(var(--b)*3 + var(--g)*2);height:calc(var(--b)*3 + var(--g)*2);transform:translate(-50%,-50%);pointer-events:none}
#dpad button{position:absolute;width:var(--b);height:var(--b);border-radius:20px;border:3px solid #ffd400;background:linear-gradient(#2e2e40,#111);color:#ffd400;font-size:calc(var(--b)*.44);line-height:1;font-family:Arial,sans-serif;touch-action:none;padding:0;pointer-events:auto;box-shadow:0 4px 0 #6b5a00,0 0 14px rgba(255,212,0,.25);display:flex;align-items:center;justify-content:center}
#dpad button:active,#dpad button.on{background:#ffd400;color:#111;transform:translateY(2px);box-shadow:0 2px 0 #6b5a00,0 0 22px rgba(255,212,0,.7)}
#dU{left:calc(var(--b) + var(--g));top:0}
#dD{left:calc(var(--b) + var(--g));top:calc(var(--b)*2 + var(--g)*2)}
#dL{left:0;top:calc(var(--b) + var(--g))}
#dR{left:calc(var(--b)*2 + var(--g)*2);top:calc(var(--b) + var(--g))}
#dC{position:absolute;left:calc(var(--b) + var(--g));top:calc(var(--b) + var(--g));width:var(--b);height:var(--b);border-radius:50%;background:radial-gradient(#22222e,#111118);border:2px solid #444;font-size:10px;display:flex;align-items:center;justify-content:center;text-align:center;color:#888;font-family:Arial,sans-serif;line-height:1.2}
body.land #app{flex-direction:row;justify-content:center;align-items:center}
body.land #dpad{height:100%;flex:1 1 auto}
</style>
</head>

function resize(){
  DPR=Math.min(3,window.devicePixelRatio||1);
  cv.width=W*DPR;cv.height=H*DPR;
  const app=document.getElementById('app'),cs=getComputedStyle(app);
  const vw=window.innerWidth,vh=window.innerHeight-(parseFloat(cs.paddingTop)||0)-(parseFloat(cs.paddingBottom)||0);
  let s;
  if(!isTouch){document.body.classList.remove('land');s=Math.min(vw/W,(vh-6)/H)}
  else{
    const g=8,land=vw>vh*1.15;document.body.classList.toggle('land',land);
    if(land){ // landscape: d-pad beside the maze
      BTN=Math.max(80,Math.min(96,Math.floor((vh*0.8-2*g)/3)));
      s=Math.min((vw-(3*BTN+2*g)-24)/W,(vh-4)/H);
    }else{ // portrait: d-pad under the maze, never overlapping it
      BTN=Math.max(80,Math.min(96,Math.floor((vh*0.36-2*g)/3)));
      const pad=3*BTN+2*g+14;
      s=Math.min(vw/W,(vh-pad)/H);
    }
    const dp=document.getElementById('dpad');dp.style.setProperty('--b',BTN+'px');dp.style.setProperty('--g',g+'px');
  }
  cv.style.width=(W*s)+'px';cv.style.height=(H*s)+'px';
}

function update(dt){
  gTime+=dt;stateT+=dt;cheerT=Math.max(0,cheerT-dt);booT=Math.max(0,booT-dt);flash=Math.max(0,flash-dt);shake=Math.max(0,shake-dt);
  for(const p of popups)p.t+=dt;popups=popups.filter(p=>p.t<p.life);
  for(const p of parts){p.t+=dt;p.x+=p.vx*dt;p.y+=p.vy*dt;p.vy+=200*dt}parts=parts.filter(p=>p.t<p.life);
  if(bigRoast){bigRoast.t+=dt;if(bigRoast.t>2.6)bigRoast=null}
  if(paused)return;
  if(state==='ready'){if(stateT>(level===1&&score===0?2.2:1.6))go('play');return}
  if(state==='bossintro'){if(stateT>3.2){setupLevel(true);go('ready')}return}
  if(state==='dying'){if(stateT>1.6){lives--;if(lives<=0){endGame(false)}else{setupLevel(false);go('ready')}}return}
  if(state==='clear'){if(stateT>1.8){level++;if(isBoss(level)){go('bossintro');SFX.boss()}else{setupLevel(true);go('ready')}}return}
  if(state==='bossdown'){if(stateT>2.2)endGame(true);return}
  if(state!=='play')return;

  for(const k in fx)fx[k]=Math.max(0,fx[k]-dt);
  // modes
  modeT+=dt;if(scatter&&modeT>5){scatter=false;modeT=0}else if(!scatter&&modeT>18){scatter=true;modeT=0}
  // roasts
  roastT-=dt;if(roastT<=0){roast();roastT=7+Math.random()*5}
  hecT-=dt;if(hecT<=0){SFX.ambient();hecT=10+Math.random()*9}
  // player
  const pspd=5.4*(fx.speed>0?1.45:1)*(1+Math.min(level,8)*0.015);
  tryCornerTurn(player);
  moveEnt(player,pspd*dt,playerDecide);
  player.anim+=dt*(player.dir?12:0);
  const pc=wrapC(Math.round(player.x)),pr=Math.round(player.y);
  if(pr>=0&&pr<ROWS){const ch=grid[pr][pc];
    if(ch==='.'){grid[pr][pc]=' ';pellets--;eaten++;addScore(10);SFX.waka();joeProj-=0.02}
    else if(ch==='T'){grid[pr][pc]=' ';pellets--;eaten++;addScore(60);SFX.td();SFX.cheer();cheerT=2;popup('TOUCHDOWN!',pc,pr,'#ffd400',16);burst(pc,pr,'#ffd400')}
    else if(ch==='o'){grid[pr][pc]=' ';pellets--;eaten++;addScore(50);startPower()}
  }
  // stars
  if(!isBoss(level)){
    if(!star&&((starsSpawned===0&&eaten>=55)||(starsSpawned===1&&eaten>=130))){spawnStar()}
  }else{
    bossStarT-=dt;if(!star&&bossStarT<=0){spawnStar();bossStarT=14}
    bossPowerT-=dt;if(bossPowerT<=0){bossPowerT=9;let cnt=0;for(const[x,y]of POWER_SPOTS)if(grid[y][x]==='o')cnt++;
      if(cnt<2){const s=POWER_SPOTS[(Math.random()*4)|0];if(grid[s[1]][s[0]]!=='o'){if(grid[s[1]][s[0]]===' ')pellets++;grid[s[1]][s[0]]='o';popup('REBUILD TOKEN!',s[0],s[1],'#ff8c00',11)}}}
    if(pellets<=0){const keep=grid;resetMaze();}
  }
  if(star){star.t-=dt;if(star.t<=0)star=null;else if(Math.abs(player.x-9)+Math.abs(player.y-11)<0.8)grabStar()}
  if(powerT>0){powerT-=dt;if(powerT<=0){for(const g of ghosts)if(g.state==='fright')g.state='active'}}
  // ghosts
  const gs=Math.min(4.7,3.0+level*0.17);
  for(const g of ghosts){
    g.bob+=dt;
    if(fx.freeze>0&&g.state!=='eyes')continue;
    if(g.state==='house'){g.houseT-=dt;if(g.houseT<=0){g.state='exit';g.x=9;g.tx=9;
        if(!g.released){g.released=true;SFX.boo(g.name);booT=1.6;popup('BOOOOO! '+g.name,9,7.2,'#f66',12);popup(g.booLine,9,8.2,'#fcc',9,2.2)}}continue}
    if(g.state==='exit'){g.y-=2.5*dt;if(g.y<=7){g.y=7;g.ty=7;g.tx=9;g.x=9;g.state=powerT>0&&g.wasFright?'fright':'active';g.dir=Math.random()<0.5?DIRS.l:DIRS.r;}continue}
    if(g.trip>0){g.trip-=dt;continue}
    let cwHold=false;
    if(g.cw&&g.state==='active'){
      if(g.sacked>0){g.sacked-=dt;continue}             // flat on his back: harmless
      if(g.hold>0){g.hold-=dt;cwHold=true;if(g.hold<=0)calebResolve(g)}
      else if(g.scramble>0){g.scramble-=dt;if(g.scramble<=0){popup('-12 YD SACK!',g.x,g.y-0.7,'#f66',12);calebSack(g);SFX.cwSack()}}
      else{g.holdT-=dt;if(g.holdT<=0){g.hold=2+Math.random();g.holdT=3.5+Math.random()*4;g.holdStart=g.hold;cwHold=true;
        popup(CW_HOLD[(Math.random()*CW_HOLD.length)|0],g.x,g.y-0.8,'#ffb26b',10,2);SFX.cwHold()}}
    }
    if(!g.cw&&g.state==='active'&&Math.random()<dt*0.05){g.trip=0.9;popup(['*TRIPS*','*FUMBLES*','*FALLS DOWN*','*PULLS HAMMY*'][(Math.random()*4)|0],g.x,g.y-0.6,'#aaf',9)}
    const sp=g.state==='eyes'?9:g.state==='fright'?2.3:cwHold?0:g.scramble>0?gs*1.3:gs;
    if(sp>0)moveEnt(g,sp*dt,ghostDecide);
    if(g.name==='DARNOLD'&&g.state==='active'){g.throwT-=dt;if(g.throwT<=0){g.throwT=Math.max(3,6.5-level*0.4)+Math.random()*3;throwInt(g)}}
    // collision
    const dd=Math.hypot(g.x-player.x,g.y-player.y);
    if(dd<0.75&&Math.abs(g.x-player.x)<COLS/2){
      if(g.state==='fright'||(fx.inv>0&&g.state==='active')){
        const wasFright=g.state==='fright';
        g.state='eyes';g.hold=g.scramble=g.sacked=0;eatChain++;const pts=200*Math.pow(2,Math.min(eatChain-1,3));addScore(pts);joeProj-=4.2;
        cheerT=2;SFX.cheer();popup(pts+'',g.x,g.y,'#0ff',13);burst(g.x,g.y,g.cw?'#c83803':'#8cf',g.cw?24:14);
        if(g.cw){SFX.cwEaten();calebSack(g,true);cheerT=3.5;popup(CW_EAT[(Math.random()*CW_EAT.length)|0],g.x,g.y-0.8,'#ff8c00',12,1.8);
          bigRoast={text:'SACK! SACK! SACK!  (CALEB SACKS: '+calebSacks+')',t:0}}
        else{if(wasFright){SFX.eatPower();popup('EAT SHIT!',g.x,g.y-1.6,'#ffd400',14,1.2)}else SFX.eat();
          popup(EAT_LINES[(Math.random()*EAT_LINES.length)|0],g.x,g.y-0.8,'#fff',10)}
      }else if(g.state==='active'){die('TACKLED BY '+g.name+'?!');return}
    }
  }
  // interceptions
  for(const b of ints){b.life-=dt;b.spin+=dt*14;moveEnt(b,(fx.freeze>0?0:6.2)*dt,intDecide);
    if(Math.hypot(b.x-player.x,b.y-player.y)<0.6&&Math.abs(b.x-player.x)<COLS/2){if(fx.inv>0){b.life=0;addScore(150);popup('PICK SIX... FOR US',b.x,b.y,'#ff0',10)}else{die(b.hero?'HIT BY A CALEB HERO BALL':'HIT BY A DARNOLD PICK');return}}}
  ints=ints.filter(b=>b.life>0);
  // boss
  if(boss&&state==='play')updateBoss(dt);
  if(state!=='play')return;
  for(const k of picks){k.t+=dt;if(fx.freeze<=0){k.x+=k.vx*dt;k.y+=k.vy*dt}
    if(Math.hypot(k.x-player.x,k.y-player.y)<0.6){if(fx.inv>0){k.t=99}else{die('SACKED BY A 7TH-ROUND PICK');return}}}
  picks=picks.filter(k=>k.t<5&&k.x>-1&&k.x<COLS&&k.y>-1&&k.y<ROWS);
  if(!isBoss(level)&&pellets<=0){go('clear');SFX.eatShitJoe(0.55);SFX.td();SFX.cheer();cheerT=3;popup('DRIVE COMPLETE!',9,11,'#ffd400',20,1.8);bigRoast={text:'EAT! SHIT! JOE!',t:0}}
}
function startPower(){
  powerT=Math.max(3.2,7.5-(level-1)*0.45);eatChain=0;SFX.power();
  for(const g of ghosts){g.hold=g.scramble=g.sacked=0;if(g.state==='active'){g.state='fright';reverseEnt(g)}g.wasFright=true}
  popup('REBUILD MODE!',player.x,player.y-1,'#ff8c00',16);popup("JOE'S GUYS -> DRAFT PICKS",player.x,player.y-0.1,'#fff',10);
  cheerT=2;
}
function spawnStar(){starsSpawned++;const s=STARS[(Math.random()*STARS.length)|0];star={...s,t:9};popup(s.full+' ON THE FIELD!',9,11.8,'#ffd400',10)}
function grabStar(){
  const s=star;star=null;SFX.bonus();SFX.cheer();cheerT=2.5;addScore(500);burst(9,11,'#ffd400',22);
  popup(s.msg,9,10.3,'#ffd400',12,2);popup('+500',9,11.2,'#fff',12);
  switch(s.name){
    case 'LAMAR':fx.speed=6;break;
    case 'CMC':fx.dbl=8;break;
    case 'CEEDEE':ints=[];picks=[];addScore(1000);break;
    case 'JSN':addScore(1500);break;
    case 'MAHOMES':fx.freeze=4;break;
    case 'BOWERS':fx.inv=6;break;
    case 'KELCE':if(lives<6)lives++;break;
  }
}
function throwInt(g){
  const b=mkEnt('int',g.tx,g.ty);b.x=g.tx;b.y=g.ty;if(wrapC(b.x)!==b.x)return;
  b.dir=g.dir;b.life=7;b.spin=0;b.bounce=0;ints.push(b);SFX.int();
  popup(['INTERCEPTION!','DARNOLD THREW A PICK!','CLASSIC DARNOLD','HE SEES GHOSTS!'][(Math.random()*4)|0],g.x,g.y-0.7,'#f8f',11);
}
// Caleb finally lets go of the ball: backwards scramble, a sack, or HERO BALL
function calebResolve(g){
  const r=Math.random();
  if(r<0.2){popup('HERO BALL!!',g.x,g.y-1.2,'#ffd400',15,1.6);popup(['INTO TRIPLE COVERAGE','PICKED. OBVIOUSLY.','THROWN TO NOBODY'][(Math.random()*3)|0],g.x,g.y-0.3,'#fff',9,1.6);SFX.cwHero();
    if(wrapC(g.tx)===g.tx&&g.dir){const b=mkEnt('int',g.tx,g.ty);b.dir=g.dir;b.life=6;b.spin=0;b.bounce=0;b.hero=true;ints.push(b)}}
  else if(r<0.6){reverseEnt(g);g.scramble=1.4+Math.random()*0.6;popup('SCRAMBLES BACKWARDS!',g.x,g.y-0.8,'#ffb26b',11);SFX.cwScram()}
  else{g.sacked=1.5+Math.random()*0.5;popup(CW_SACK[(Math.random()*CW_SACK.length)|0],g.x,g.y-0.8,'#ff8c00',12,1.6);calebSack(g);SFX.cwSack();shake=Math.max(shake,0.15)}
}
function updateBoss(dt){
  const b=boss;b.t+=dt;b.inv=Math.max(0,b.inv-dt);b.hitFlash=Math.max(0,b.hitFlash-dt);
  if(fx.freeze<=0){
    const vuln=powerT>0;let dx=player.x-b.x,dy=player.y-b.y,d=Math.hypot(dx,dy)||1;
    const sp=(vuln?-1.4:1.35+level*0.06);
    b.x+=dx/d*sp*dt+Math.sin(b.t*1.7)*dt*1.2;b.y+=dy/d*sp*dt+Math.cos(b.t*1.3)*dt*0.9;
    b.x=Math.max(1.5,Math.min(COLS-2.5,b.x));b.y=Math.max(1.5,Math.min(ROWS-2.5,b.y));
    b.fireT-=dt;if(b.fireT<=0&&!vuln){b.fireT=Math.max(2.2,4-level*0.15);const n=6;const off=Math.random()*6.28;
      for(let i=0;i<n;i++){const a=off+i/n*6.28;picks.push({x:b.x,y:b.y,vx:Math.cos(a)*3.2,vy:Math.sin(a)*3.2,t:0})}
      tone(150,0.25,'sawtooth',0.05,-60);popup('FIRING DRAFT PICKS!',b.x,b.y-2,'#f90',10)}
  }
  const dd=Math.hypot(b.x-player.x,b.y-player.y);
  if(dd<1.55){
    if((powerT>0||fx.inv>0)&&b.inv<=0){
      b.hp--;b.inv=1.6;b.hitFlash=0.5;addScore(2000);joeProj-=9.9;SFX.hit();SFX.cheer();cheerT=3;shake=0.4;burst(b.x,b.y,'#f90',30);
      popup('-1 REBUILD!',b.x,b.y-1.5,'#ff0',16);roast();
      const far=[[3,3],[15,3],[3,17],[15,17]].sort((a,c)=>Math.hypot(c[0]-player.x,c[1]-player.y)-Math.hypot(a[0]-player.x,a[1]-player.y))[0];
      b.x=far[0];b.y=far[1];
      if(b.hp<=0){go('bossdown');SFX.eatShitJoe(0.55);SFX.td();SFX.laugh();bigRoast={text:'EAT! SHIT! JOE!',t:0};popup('THE REBUILD IS DEMOLISHED!',9,10,'#ffd400',16,2.2);burst(9,10,'#ffd400',60);picks=[];ints=[];}
    }else if(powerT<=0&&fx.inv<=0&&b.inv<=0){die('CRUSHED BY THE REBUILD');}
  }
}
function die(msg){go('dying');SFX.die();popup(msg,player.x,player.y-1,'#f55',11,1.6);joeProj+=0.5;flash=0.3;
  popup('JOE GETS 0.5 PITY PTS',9,12,'#aaa',9,1.6)}
function endGame(victory){
  if(score>hi){hi=score;localStorage.setItem('wh_hi',hi)}
  endInfo={victory,roast:victory?["THANKS FOR THE FREE WIN, JOE","THE REBUILD GOT REBUILT INTO RUBBLE","JOE DRAFTED VIBES. VIBES LOST."][(Math.random()*3)|0]:
    ["THE WEASEL WENT DOWN... JOE STILL LOST","EVEN JOE'S WINS ARE LOSSES","JOE'S TEAM: HISTORICALLY BAD. STILL."][(Math.random()*3)|0]};
  go(victory?'victory':'gameover');SFX.laugh();
}

// ---------- drawing helpers ----------
const FONT='"Arial Black",Impact,"Helvetica Neue",Arial,sans-serif';
function txt(s,x,y,size,col,align,stroke,sw){ctx.font=`900 ${size}px ${FONT}`;ctx.textAlign=align||'center';ctx.textBaseline='middle';
  if(stroke){ctx.lineJoin='round';ctx.lineWidth=sw||Math.max(2,size/7);ctx.strokeStyle=stroke;ctx.strokeText(s,x,y)}ctx.fillStyle=col||'#fff';ctx.fillText(s,x,y)}
function fitTxt(s,x,y,size,maxW,col,stroke){ctx.font=`900 ${size}px ${FONT}`;let w=ctx.measureText(s).width;if(w>maxW)size=size*maxW/w;txt(s,x,y,size,col,'center',stroke)}
function rr(x,y,w,h,r){ctx.beginPath();ctx.moveTo(x+r,y);ctx.arcTo(x+w,y,x+w,y+h,r);ctx.arcTo(x+w,y+h,x,y+h,r);ctx.arcTo(x,y+h,x,y,r);ctx.arcTo(x,y,x+w,y,r);ctx.closePath()}
function football(x,y,s,rot,col){ctx.save();ctx.translate(x,y);ctx.rotate(rot);ctx.fillStyle=col||'#8b4a1f';ctx.beginPath();ctx.ellipse(0,0,s,s*0.6,0,0,6.283);ctx.fill();
  ctx.strokeStyle='#fff';ctx.lineWidth=Math.max(0.8,s*0.16);ctx.beginPath();ctx.moveTo(-s*0.4,0);ctx.lineTo(s*0.4,0);ctx.stroke();
  for(let i=-1;i<=1;i++){ctx.beginPath();ctx.moveTo(i*s*0.2,-s*0.18);ctx.lineTo(i*s*0.2,s*0.18);ctx.stroke()}ctx.restore()}
const tx=x=>x*T+T/2,ty=y=>MY+y*T+T/2;

function drawWeasel(x,y,r,rot){
  ctx.save();ctx.translate(x,y);if(rot)ctx.rotate(rot);
  ctx.fillStyle='#ffd400';ctx.beginPath();ctx.arc(0,0,r+2,0,6.283);ctx.fill();
  if(weaselOK){ctx.save();ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.clip();ctx.drawImage(weaselImg,-r,-r,r*2,r*2);ctx.restore()}
  else{ctx.fillStyle='#a07040';ctx.beginPath();ctx.arc(0,0,r,0,6.283);ctx.fill();ctx.fillStyle='#111';ctx.fillRect(-r*0.7,-r*0.2,r*1.4,r*0.3);ctx.fillRect(-r*0.8,-r*0.9,r*1.6,r*0.5)}
  ctx.restore();
}
// Cartoon cheerleader (fully clothed uniform, playful, non-explicit)
function cheerleader(x,y,s,t,o){
  o=o||{};const bounce=Math.abs(Math.sin(t*(o.speed||6)))*8*s;const uni=o.col||'#5b2a86',acc=o.acc||'#ffd400',skin=o.skin||'#f2c29b',hair=o.hair||'#6b3a1e';
  ctx.save();ctx.translate(x,y-bounce);ctx.scale(s,s);
  ctx.lineCap='round';
  // legs + boots
  ctx.strokeStyle=skin;ctx.lineWidth=7;ctx.beginPath();ctx.moveTo(-7,30);ctx.lineTo(-9,58);ctx.moveTo(7,30);ctx.lineTo(9,58);ctx.stroke();
  ctx.fillStyle='#fff';rr(-15,54,12,8,3);ctx.fill();rr(3,54,12,8,3);ctx.fill();
  // skirt (pleated, knee-ish)
  ctx.fillStyle=uni;ctx.beginPath();ctx.moveTo(-13,14);ctx.lineTo(13,14);ctx.lineTo(21,40);ctx.lineTo(-21,40);ctx.closePath();ctx.fill();
  ctx.strokeStyle=acc;ctx.lineWidth=2;for(let i=-2;i<=2;i++){ctx.beginPath();ctx.moveTo(i*5,16);ctx.lineTo(i*8,40);ctx.stroke()}
  // top (full shell top with W)
  ctx.fillStyle=uni;rr(-14,-14,28,32,7);ctx.fill();ctx.fillStyle=acc;ctx.fillRect(-14,-14,28,5);
  ctx.font=`900 15px ${FONT}`;ctx.textAlign='center';ctx.textBaseline='middle';ctx.fillStyle=acc;ctx.fillText('W',0,4);
  // arms
  ctx.strokeStyle=skin;ctx.lineWidth=6;
  const wave=Math.sin(t*(o.speed||6)*1.3);
  // left arm up w/ pompom
  ctx.beginPath();ctx.moveTo(-12,-10);ctx.lineTo(-24,-28-wave*6);ctx.stroke();pom(-26,-32-wave*6,acc);
  if(o.point){ // right arm pointing out at the viewer: foreshortened arm + big hand + index finger
    ctx.beginPath();ctx.moveTo(12,-8);ctx.lineTo(18,2);ctx.stroke();
    ctx.fillStyle=skin;ctx.beginPath();ctx.arc(20,6,8,0,6.283);ctx.fill();
    ctx.strokeStyle='#c98f68';ctx.lineWidth=1.5;ctx.beginPath();ctx.arc(20,6,8,0,6.283);ctx.stroke();
    ctx.strokeStyle=skin;ctx.lineWidth=5;ctx.beginPath();ctx.moveTo(22,8);ctx.lineTo(27,14);ctx.stroke();
    ctx.fillStyle=skin;ctx.beginPath();ctx.arc(27.5,14.5,4.2,0,6.283);ctx.fill();ctx.strokeStyle='#c98f68';ctx.lineWidth=1.2;ctx.stroke();
    ctx.fillStyle='#ffb6c8';ctx.beginPath();ctx.arc(28,15,1.9,0,6.283);ctx.fill();
  }else{ctx.beginPath();ctx.moveTo(12,-10);ctx.lineTo(24,-28+wave*6);ctx.stroke();pom(26,-32+wave*6,acc)}
  // head
  ctx.fillStyle=hair;ctx.beginPath();ctx.arc(0,-28,15,0,6.283);ctx.fill();
  ctx.beginPath();ctx.ellipse(14+Math.sin(t*8)*3,-36,6,11,0.6,0,6.283);ctx.fill(); // ponytail
  ctx.fillStyle=skin;ctx.beginPath();ctx.arc(0,-25,12.5,0,6.283);ctx.fill();
  ctx.fillStyle=hair;ctx.beginPath();ctx.arc(0,-31,12.5,Math.PI*1.05,Math.PI*1.95);ctx.fill();
  ctx.fillStyle=acc;ctx.beginPath();ctx.arc(-8,-38,4,0,6.283);ctx.fill(); // bow
  ctx.strokeStyle='#222';ctx.lineWidth=1.8;
  if(o.laugh){ // squeezed-shut laughing eyes ^ ^, giant open mouth, laugh tears
    ctx.beginPath();ctx.moveTo(-8,-26);ctx.lineTo(-5,-29);ctx.lineTo(-2,-26);ctx.moveTo(2,-26);ctx.lineTo(5,-29);ctx.lineTo(8,-26);ctx.stroke();
    ctx.fillStyle='#6b0f1a';ctx.beginPath();ctx.moveTo(-7,-21);ctx.quadraticCurveTo(0,-8+Math.sin(t*20)*2,7,-21);ctx.closePath();ctx.fill();
    ctx.fillStyle='#ff7b8a';ctx.beginPath();ctx.arc(0,-16+Math.sin(t*20),2.5,0,6.283);ctx.fill();
    ctx.fillStyle='#7cd3ff';ctx.beginPath();ctx.arc(-10,-22+((t*30)%8),1.8,0,6.283);ctx.arc(10,-22+((t*30+4)%8),1.8,0,6.283);ctx.fill();
  }else{ctx.fillStyle='#222';ctx.beginPath();ctx.arc(-4.5,-27,1.8,0,6.283);ctx.arc(4.5,-27,1.8,0,6.283);ctx.fill();
    ctx.beginPath();ctx.arc(0,-21,4.5,0.2,Math.PI-0.2);ctx.stroke()}
  ctx.fillStyle='rgba(255,90,120,.35)';ctx.beginPath();ctx.arc(-9,-21,2.6,0,6.283);ctx.arc(9,-21,2.6,0,6.283);ctx.fill();
  ctx.restore();
}
function pom(x,y,c){ctx.fillStyle=c;for(let i=0;i<7;i++){const a=i/7*6.283;ctx.beginPath();ctx.arc(x+Math.cos(a)*5,y+Math.sin(a)*5,4.5,0,6.283);ctx.fill()}ctx.fillStyle='#fff';ctx.beginPath();ctx.arc(x,y,3,0,6.283);ctx.fill()}
function fan(x,y,s,t,i,hype){
  const b=hype?Math.abs(Math.sin(t*10+i))*5:Math.abs(Math.sin(t*2+i))*1.2;
  const skins=['#f2c29b','#c68642','#8d5524','#ffdbac','#e0ac69'],shirts=['#ffd400','#5b2a86','#111','#e33','#2b8','#fff'];
  ctx.save();ctx.translate(x,y-b);ctx.scale(s,s);

// ---------- loop ----------
function musicFor(){
  if(state==='title')return 'title';
  if(state==='bossintro')return 'boss';
  if(state==='gameover'||state==='victory')return 'ending';
  if(state==='dying'||state==='clear'||state==='bossdown'||paused)return 'none';
  if(powerT>0&&state==='play')return 'rebuild';
  return isBoss(level)?'boss':'main';
}
let last=performance.now();
function frame(now){
  let dt=Math.min(0.05,(now-last)/1000);last=now;
  try{update(dt)}catch(e){console.error(e)}
  try{AUD.setTheme(musicFor());AUD.ambience=state==='title'?0.6:(state==='gameover'||state==='victory')?0.9:paused?0.25:0.5}catch(e){console.error(e)}
  ctx.setTransform(DPR,0,0,DPR,0,0);ctx.clearRect(0,0,W,H);
  if(state==='title')drawTitle();
  else if(state==='bossintro')drawBossIntro();
  else if(state==='gameover'||state==='victory')drawEnding();
  else drawGame();
  requestAnimationFrame(frame);
}
resetMaze();
requestAnimationFrame(frame);
// test/debug hook (read-only-ish helpers)
window.__WH={get state(){return state},get player(){return player},get score(){return score},get lives(){return lives},get level(){return level},
  get calebSacks(){return calebSacks},get ghosts(){return ghosts.map(g=>({name:g.name,state:g.state,x:g.x,y:g.y,hold:g.hold,scramble:g.scramble,sacked:g.sacked}))},
  clearLevel(){if(state==='play'){for(const r of grid)for(let c=0;c<r.length;c++)if('.oT'.includes(r[c]))r[c]=' ';pellets=1;grid[player.ty][wrapC(player.tx)]='.'}},
  feed(name){const g=ghosts.find(g=>g.name===name);if(!g||state!=='play')return false;if(powerT<=0)startPower();g.state='fright';g.x=g.tx=player.x;g.y=g.ty=player.y;return true},
  god(t){fx.inv=t||60;lives=Math.max(lives,3)},
  calebHold(){const g=ghosts.find(g=>g.cw);if(g&&g.state==='active'){g.holdT=0.001;return true}return false},
  audio:AUD,power(){if(state==='play')startPower()},forceEnd(v){if(!player)setupLevel(true);endGame(!!v)},killAll(){lives=1;die('TEST')},goBoss(){level=3;setupLevel(true);go('ready')}};
})();
